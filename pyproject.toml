[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcap-cli"
version = "0.1.3"
description = "API-key spend guard for unattended Codex CLI and Gemini CLI runs: hard per-run cap, kills the process at the limit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kutay Karahan", email = "kutaykarahan6@gmail.com" }]
keywords = [
  "ai-agents",
  "budget",
  "codex-cli",
  "cost-control",
  "gemini-cli",
  "llm",
  "spend-cap",
  "proxy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
agentcap = "agentcap.cli:main"

[project.urls]
Homepage = "https://agentcap.launchbench.studio"
Repository = "https://github.com/Blitz00X/agentcap"
Issues = "https://github.com/Blitz00X/agentcap/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcap"]

[tool.hatch.build.targets.sdist]
include = ["src/agentcap", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
